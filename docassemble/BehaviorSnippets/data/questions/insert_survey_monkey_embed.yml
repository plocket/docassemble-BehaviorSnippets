features:
  question back button: True
  javascript:
    - survey_monkey_script.js
    - insert_arbitrary_script.js
  css:
    
---
mandatory: True
code: |
  if wants_to_see_bug:
    bug
  else:
    solution
  end
---
id: demo choice
question: Which demo?
fields:
  - Which do you want to see?: wants_to_see_bug
    datatype: radio
    choices:
      - The buggy page: True
      - The fixed page: False
---
id: the bug
question: The buggy form
subquestion: |
  Here is the buggy form.

  ${ survey_embed_script }
continue button field: bug
---
id: the solution
question: The solution
subquestion: |
  Here is the solution.

  <div id="survey_monkey1"></div>
continue button field: solution
---
id: the end
event: end
question: |
  Thanks for stopping by :hand-wave:
---
